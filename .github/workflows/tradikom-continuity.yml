name: Continuité TRADIKOM ONE

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  pull_request:
    branches:
      - main

jobs:
  continuity:
    name: Vérifier la continuité et la north star
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances figées
        run: pnpm install --frozen-lockfile

      - name: Contrôler l'état de reprise
        run: pnpm agent:continuity-check

      - name: Publier l'état de continuité
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradikom-continuity-${{ github.run_attempt }}
          path: |
            docs/AGENT_STATE.json
            docs/WORKLOG.md
            docs/NEXT_STEPS.md
            docs/DRIFT_REPORT.md
            docs/ROADMAP_TRADIKOM_ONE_OS.md
          if-no-files-found: error
          retention-days: 14
